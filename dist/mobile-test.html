<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>RWD 測試頁面</title>
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .test-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .device-info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 12px;
        }

        .breakpoint-test {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .test-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #eee;
            text-align: center;
        }

        .test-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px 0;
            transition: all 0.3s;
        }

        .test-button:active {
            transform: scale(0.95);
        }

        .form-test {
            margin: 20px 0;
        }

        .form-test input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        .page-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .page-link {
            display: block;
            padding: 15px;
            background: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .orientation-test {
            background: #ffeb3b;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
        }

        /* 響應式測試指示器 */
        .responsive-indicator::after {
            content: "未知";
            background: #999;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        @media screen and (max-width: 767px) {
            .responsive-indicator::after {
                content: "📱 手機版";
                background: #4CAF50;
            }
            
            .test-card {
                border-color: #4CAF50;
            }
        }

        @media screen and (min-width: 768px) and (max-width: 1023px) {
            .responsive-indicator::after {
                content: "📟 平板版";
                background: #FF9800;
            }
            
            .test-card {
                border-color: #FF9800;
            }
        }

        @media screen and (min-width: 1024px) {
            .responsive-indicator::after {
                content: "🖥️ 桌面版";
                background: #2196F3;
            }
            
            .test-card {
                border-color: #2196F3;
            }
        }

        @media screen and (orientation: landscape) {
            .orientation-test::after {
                content: "📐 橫向模式";
            }
        }

        @media screen and (orientation: portrait) {
            .orientation-test::after {
                content: "📱 直向模式";
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 RWD 響應式設計測試</h1>
        
        <div class="device-info" id="deviceInfo">
            載入設備資訊中...
        </div>

        <div class="responsive-indicator">
            目前斷點: 
        </div>

        <div class="orientation-test">
            螢幕方向: 
        </div>
    </div>

    <div class="test-container">
        <h2>📋 功能測試</h2>
        
        <div class="breakpoint-test">
            <div class="test-card">
                <h3>觸控測試</h3>
                <button class="test-button" onclick="testTouch(this)">點擊測試</button>
                <button class="test-button" onclick="testVibration()">震動測試</button>
            </div>

            <div class="test-card">
                <h3>視窗測試</h3>
                <button class="test-button" onclick="testViewport()">視窗資訊</button>
                <button class="test-button" onclick="testSafeArea()">安全區域</button>
            </div>

            <div class="test-card">
                <h3>方向測試</h3>
                <button class="test-button" onclick="testOrientation()">旋轉螢幕</button>
                <button class="test-button" onclick="testFullscreen()">全螢幕</button>
            </div>
        </div>

        <div class="form-test">
            <h3>📝 表單測試 (iOS 縮放防護)</h3>
            <input type="text" placeholder="測試輸入 - 應該不會縮放">
            <input type="email" placeholder="Email 測試">
            <input type="password" placeholder="密碼測試">
        </div>
    </div>

    <div class="test-container">
        <h2>🔗 頁面連結測試</h2>
        <div class="page-links">
            <a href="login.html" class="page-link">📱 登入頁面 (RWD)</a>
            <a href="register.html" class="page-link">📝 註冊頁面 (RWD)</a>
            <a href="index.html" class="page-link">🗺️ 主地圖 (RWD)</a>
            <a href="admin-panel.html" class="page-link">⚙️ 管理面板 (RWD)</a>
        </div>
    </div>

    <script>
        // 設備資訊顯示
        function updateDeviceInfo() {
            const info = document.getElementById('deviceInfo');
            const viewport = window.visualViewport || {
                width: window.innerWidth,
                height: window.innerHeight
            };
            
            info.innerHTML = `
螢幕尺寸: ${screen.width} × ${screen.height}
視窗大小: ${window.innerWidth} × ${window.innerHeight}
Visual Viewport: ${viewport.width} × ${viewport.height}
DPR: ${window.devicePixelRatio}
User Agent: ${navigator.userAgent.substring(0, 50)}...
Touch Support: ${('ontouchstart' in window) ? '✅' : '❌'}
網路狀態: ${navigator.onLine ? '🟢 在線' : '🔴 離線'}
            `;
        }

        // 觸控測試
        function testTouch(btn) {
            btn.textContent = '✅ 觸控正常';
            btn.style.background = '#4CAF50';
            setTimeout(() => {
                btn.textContent = '點擊測試';
                btn.style.background = '#4CAF50';
            }, 1000);
        }

        // 震動測試
        function testVibration() {
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
                alert('震動測試完成 ✅');
            } else {
                alert('此設備不支援震動 ❌');
            }
        }

        // 視窗測試
        function testViewport() {
            const viewport = window.visualViewport || {
                width: window.innerWidth,
                height: window.innerHeight,
                scale: 1
            };
            
            alert(`視窗資訊:
寬度: ${viewport.width}px
高度: ${viewport.height}px
縮放: ${viewport.scale || 1}x
滾動: ${window.scrollX}, ${window.scrollY}`);
        }

        // 安全區域測試
        function testSafeArea() {
            const style = getComputedStyle(document.documentElement);
            const top = style.getPropertyValue('--safe-area-inset-top');
            const right = style.getPropertyValue('--safe-area-inset-right');
            const bottom = style.getPropertyValue('--safe-area-inset-bottom');
            const left = style.getPropertyValue('--safe-area-inset-left');
            
            alert(`安全區域:
Top: ${top || '0px'}
Right: ${right || '0px'}
Bottom: ${bottom || '0px'}
Left: ${left || '0px'}`);
        }

        // 方向測試
        function testOrientation() {
            alert(`螢幕方向資訊:
Orientation: ${screen.orientation ? screen.orientation.type : 'unknown'}
Angle: ${window.orientation || 0}°
建議: 請嘗試旋轉螢幕查看變化`);
        }

        // 全螢幕測試
        function testFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen().catch(err => {
                    alert('全螢幕不被支援: ' + err.message);
                });
            }
        }

        // 初始化
        updateDeviceInfo();
        
        // 監聽變化
        window.addEventListener('resize', updateDeviceInfo);
        window.addEventListener('orientationchange', () => {
            setTimeout(updateDeviceInfo, 500);
        });
        
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateDeviceInfo);
        }
        
        // 網路狀態監聽
        window.addEventListener('online', updateDeviceInfo);
        window.addEventListener('offline', updateDeviceInfo);

        console.log('📱 RWD 測試頁面已載入');
    </script>
</body>
</html>
