<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大漢溪抽水站地圖</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
    #map { width: 100%; height: 100vh; }
    .panel {
      position: absolute;
      top: 12px;
      left: 52px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      max-width: 320px;
    }
    .panel h1 { font-size: 1.1rem; margin-bottom: 4px; color: #1a5276; }
    .panel p { font-size: 0.85rem; color: #555; line-height: 1.4; }
    .panel .count { font-weight: 600; color: #2471a3; }
    .leaflet-popup-content { font-size: 0.9rem; line-height: 1.5; }
    .leaflet-popup-content strong { color: #1a5276; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>大漢溪抽水站</h1>
    <p>共 <span class="count" id="count">—</span> 處 · 資料來源：Plus Code 座標</p>
    <p style="margin-top:6px;font-size:0.8rem;">
      <a href="data/pumping-stations.geojson" download>下載 GeoJSON</a>
      · 可貼至 <a href="https://geojson.io" target="_blank" rel="noopener">geojson.io</a>
    </p>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map").setView([25.04, 121.47], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
      maxZoom: 19,
    }).addTo(map);

    const icon = L.divIcon({
      className: "pump-marker",
      html: '<div style="background:#2471a3;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });

    fetch("data/pumping-stations.geojson")
      .then((r) => r.json())
      .then((geojson) => {
        document.getElementById("count").textContent = geojson.features.length;

        const layer = L.geoJSON(geojson, {
          pointToLayer: (_, latlng) => L.marker(latlng, { icon }),
          onEachFeature: (feature, layer) => {
            const p = feature.properties;
            layer.bindPopup(`
              <strong>${p.name}</strong><br/>
              ${p.village} · ${p.district}<br/>
              Plus Code: <code>${p.plus_code}</code><br/>
              經度 ${feature.geometry.coordinates[0].toFixed(5)}<br/>
              緯度 ${feature.geometry.coordinates[1].toFixed(5)}
            `);
          },
        }).addTo(map);

        map.fitBounds(layer.getBounds().pad(0.08));
      })
      .catch((err) => {
        console.error(err);
        alert("無法載入 data/pumping-stations.geojson，請用本機伺服器開啟此頁面。");
      });
  </script>
</body>
</html>
