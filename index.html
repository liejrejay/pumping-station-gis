<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>大漢溪抽水站地圖</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
    #map { width: 100%; height: 100vh; }
    .panel {
      position: absolute;
      top: 12px;
      left: 52px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      max-width: 320px;
    }
    .panel h1 { font-size: 1.1rem; margin-bottom: 4px; color: #1a5276; }
    .panel p { font-size: 0.85rem; color: #555; line-height: 1.4; }
    .panel .count { font-weight: 600; color: #2471a3; }
    .leaflet-popup-content { font-size: 0.9rem; line-height: 1.5; }
    .leaflet-popup-content strong { color: #1a5276; }
    
    /* 確保用戶面板在圖層控制器上方 */
    .user-panel {
      z-index: 1001 !important;
    }
    
    /* 調整圖層控制器位置 */
    .leaflet-control-layers {
      margin-top: 85px !important;
    }
    
    /* 讓用戶面板更緊湊 */
    .user-panel .user-info {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    
    .user-panel .user-details {
      flex: 1;
      min-width: 0;
    }
    
    .user-panel .logout-btn {
      width: 100%;
      padding: 4px 6px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .user-panel .logout-btn:hover {
      background: #c82333;
    }

    /* 手機版 body 滑動修復 */
    @media screen and (max-width: 767px) {
      body {
        overflow: auto !important;
        -webkit-overflow-scrolling: touch !important;
        height: 100vh !important;
      }
      
      #map {
        touch-action: pan-x pan-y !important;
      }

      /* 移動 Leaflet 版權資訊到底部 */
      .leaflet-control-attribution {
        position: fixed !important;
        bottom: 0 !important;
        right: 0 !important;
        left: auto !important;
        background: rgba(0, 0, 0, 0.5) !important;
        color: white !important;
        padding: 2px 6px !important;
        font-size: 0.6rem !important;
        border-radius: 3px 0 0 0 !important;
        z-index: 999 !important;
      }

      .leaflet-control-attribution a {
        color: #ccc !important;
      }
    }
  </style>
</head>
<body>
  <!-- 載入畫面 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-logo">
      <span style="font-size: 3rem; color: #1e3c72;">🌊</span>
    </div>
    <div class="loading-text">雙北大漢溪抽水站系統</div>
    <div class="loading-subtitle">正在載入智慧水利管理平台...</div>
    <div class="loading-spinner"></div>
    <div class="loading-features">
      <div class="loading-feature">🏢 即時監控</div>
      <div class="loading-feature">📊 數據分析</div>
      <div class="loading-feature">🔧 智慧管理</div>
      <div class="loading-feature">🌐 政府開放資料</div>
    </div>
  </div>

  <div id="map"></div>
  <!-- 用戶資訊面板 -->
  <div class="user-panel user-panel-enter" id="userPanel" style="
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1001;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    max-width: 180px;
    font-size: 0.75rem;
  ">
    <div class="user-info">
      <span style="font-size: 1rem;">👤</span>
      <div class="user-details">
        <div id="userName" style="font-weight: 600; color: #1a5276; font-size: 0.8rem; line-height: 1.2;">載入中...</div>
        <div id="userRole" style="color: #666; font-size: 0.65rem; line-height: 1.1;">載入中...</div>
      </div>
    </div>
    <button onclick="logout()" class="logout-btn">登出</button>
  </div>

  <!-- 主控制面板 -->
  <div class="panel panel-enter">
    <h1>雙北大漢溪 - 抽水站</h1>
    <p>共 <span class="count" id="count">載入中...</span> 處</p>
    <p>資料來源：<span id="source">政府開放資料</span></p>
    <p style="margin-top:6px;font-size:0.8rem;">
      涵蓋範圍：台北市、新北市大漢溪流域
    </p>
    <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 0.8rem;">
        <span id="updateStatus" style="color: #666;">載入中...</span>
        <div id="refreshIndicator" style="width: 12px; height: 12px; border-radius: 50%; background: #ccc;"></div>
      </div>
      <button id="manualRefresh" onclick="manualRefresh()" style="
        margin-top: 4px; 
        padding: 4px 8px; 
        font-size: 0.75rem; 
        background: #2471a3; 
        color: white; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer;
      ">立即更新</button>
      <div id="adminControls" style="margin-top: 6px; display: none;">
        <button onclick="exportData()" style="
          padding: 4px 8px;
          font-size: 0.75rem;
          background: #28a745;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          margin-right: 4px;
        ">匯出抽水站資料</button>
        <button onclick="exportUsers()" style="
          padding: 4px 8px;
          font-size: 0.75rem;
          background: #17a2b8;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          margin-right: 4px;
        ">匯出用戶資料</button>
        <button onclick="showUserStats()" style="
          padding: 4px 8px;
          font-size: 0.75rem;
          background: #6c757d;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          margin-right: 4px;
        ">用戶統計</button>
        <button onclick="openAdminPanel()" style="
          padding: 4px 8px;
          font-size: 0.75rem;
          background: #fd7e14;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        ">管理面板</button>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/userManager.js"></script>
  <script src="js/mobileOptimization.js"></script>
  <script>
    // 台灣範圍限制
    const TAIWAN_BOUNDS = L.latLngBounds(
      [21.5, 119.5], // 西南角 (屏東、澎湖)
      [25.5, 122.5]  // 東北角 (基隆、宜蘭)
    );

    // 雙北大漢溪流域範圍 (台北市、新北市)
    const map = L.map("map", {
      center: [25.02, 121.45],
      zoom: 13,
      minZoom: 7,        // 最小縮放級別 (可以看到整個台灣)
      maxZoom: 20,       // 最大縮放級別 (Google Maps 支援更高縮放)
      maxBounds: TAIWAN_BOUNDS,           // 限制平移範圍在台灣
      maxBoundsViscosity: 1.0             // 邊界彈性 (1.0 = 完全限制)
    });

    // Google 地圖圖層
    const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      minZoom: 7,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; <a href="https://www.google.com/maps">Google Maps</a> | 範圍限制：台灣地區'
    });

    const googleSatellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      minZoom: 7,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; <a href="https://www.google.com/maps">Google Maps</a> | 範圍限制：台灣地區'
    });

    const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      minZoom: 7,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; <a href="https://www.google.com/maps">Google Maps</a> | 範圍限制：台灣地區'
    });

    const googleTerrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      minZoom: 7,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; <a href="https://www.google.com/maps">Google Maps</a> | 範圍限制：台灣地區'
    });

    // 預設使用 Google 街道圖
    googleStreets.addTo(map);

    // 圖層控制器
    const baseMaps = {
      "Google 街道圖": googleStreets,
      "Google 衛星圖": googleSatellite,
      "Google 混合圖": googleHybrid,
      "Google 地形圖": googleTerrain
    };

    // 圖層控制器 - 調整位置避免與用戶面板重疊
    L.control.layers(baseMaps, null, {
      position: 'topright',
      collapsed: true
    }).addTo(map);

    // 調整圖層控制器的 CSS，讓它在用戶面板下方
    setTimeout(() => {
      const layerControl = document.querySelector('.leaflet-control-layers');
      if (layerControl) {
        layerControl.style.marginTop = '85px'; // 用戶面板高度 + 間距
      }
    }, 100);

    const icon = L.divIcon({
      className: "pump-marker",
      html: '<div style="background:#2471a3;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });

    // 雙北大漢溪流域邊界 (台北市+新北市)
    const DAHAN_RIVER_BOUNDS = {
      north: 25.12,  // 五股、蘆洲北邊
      south: 24.95,  // 土城、樹林南邊
      east: 121.55,  // 台北市邊界
      west: 121.35   // 新莊、樹林西邊
    };

    // 雙北大漢溪抽水站的 API
    const APIs = [
      {
        name: "新北市抽水站",
        url: "https://data.ntpc.gov.tw/api/datasets/71cd1490-a2df-4198-bef1-318479775e8a/json?size=1000",
        type: "ntpc"
      },
      {
        name: "台北市水利設施",
        url: "https://data.gov.tw/api/v1/rest/datastore/296203?format=json&limit=1000",
        type: "taipei"
      },
      {
        name: "水利署雙北抽水站",
        url: "https://data.gov.tw/api/v1/rest/datastore/25768?format=json&limit=1000",
        type: "general"
      }
    ];

    // 檢查座標是否在大漢溪流域範圍內
    function isInDahanRiverArea(lat, lng) {
      return lat >= DAHAN_RIVER_BOUNDS.south && 
             lat <= DAHAN_RIVER_BOUNDS.north && 
             lng >= DAHAN_RIVER_BOUNDS.west && 
             lng <= DAHAN_RIVER_BOUNDS.east;
    }

    // 檢查名稱是否與大漢溪相關
    function isDahanRiverRelated(name, address = "") {
      const keywords = ["大漢溪", "大溪", "龍潭", "平鎮", "中壢", "桃園", "八德", "龜山", "新莊", "板橋", "土城", "樹林", "三峽", "鶯歌"];
      const fullText = (name + " " + address).toLowerCase();
      return keywords.some(keyword => fullText.includes(keyword));
    }

    // 全域變數
    let currentLayers = [];
    let updateInterval;
    let lastUpdateTime = null;
    let isUpdating = false;

    // 更新狀態顯示
    function updateStatus(message, isError = false, isSuccess = false) {
      const statusElement = document.getElementById('updateStatus');
      const indicator = document.getElementById('refreshIndicator');
      
      statusElement.textContent = message;
      
      if (isError) {
        statusElement.style.color = '#dc3545';
        indicator.style.background = '#dc3545';
      } else if (isSuccess) {
        statusElement.style.color = '#28a745';
        indicator.style.background = '#28a745';
      } else {
        statusElement.style.color = '#666';
        indicator.style.background = '#ffc107';
      }
    }

    // 清除現有圖層
    function clearLayers() {
      currentLayers.forEach(layer => {
        if (map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });
      currentLayers = [];
    }

    // 手動刷新功能
    function manualRefresh() {
      if (isUpdating) {
        updateStatus('更新中，請稍候...', false, false);
        return;
      }
      
      updateStatus('手動更新中...', false, false);
      clearLayers();
      loadLocalData(); // 優先載入本地資料
    }

    // 定期更新功能
    function startAutoUpdate() {
      // 每 5 分鐘更新一次 (300000 毫秒)
      const UPDATE_INTERVAL = 5 * 60 * 1000;
      
      updateInterval = setInterval(() => {
        if (!isUpdating) {
          updateStatus('自動更新中...', false, false);
          clearLayers();
          loadLocalData(); // 自動更新時也優先載入本地資料
        }
      }, UPDATE_INTERVAL);
      
      console.log('自動更新已啟動，每 5 分鐘更新一次');
    }

    // 停止自動更新
    function stopAutoUpdate() {
      if (updateInterval) {
        clearInterval(updateInterval);
        updateInterval = null;
        console.log('自動更新已停止');
      }
    }

    async function loadGovernmentData() {
      if (isUpdating) {
        console.log('更新進行中，跳過此次請求');
        return;
      }
      
      isUpdating = true;
      let totalCount = 0;
      let loadedAny = false;
      const startTime = Date.now();

      updateStatus('正在連接政府 API...', false, false);

      for (const api of APIs) {
        try {
          console.log(`嘗試載入: ${api.name}`);
          
          const response = await fetch(api.url);
          
          if (!response.ok) {
            console.warn(`API ${api.name} 回應錯誤: ${response.status}`);
            continue;
          }
          
          const data = await response.json();
          console.log(`${api.name} 資料:`, data);
          
          let features = [];
          
          if (api.type === "tycg" && data.result && data.result.records) {
            // 桃園市政府資料格式 - 只取抽水站相關設施
            features = data.result.records
              .filter(record => {
                const name = record.name || record.facility_name || "";
                const type = record.type || record.facility_type || "";
                return name.includes("抽水") || type.includes("抽水") || name.includes("pumping");
              })
              .map(record => {
                const lat = parseFloat(record.latitude || record.lat);
                const lng = parseFloat(record.longitude || record.lng);
                
                if (lat && lng && isInDahanRiverArea(lat, lng)) {
                  return {
                    type: "Feature",
                    geometry: {
                      type: "Point",
                      coordinates: [lng, lat]
                    },
                    properties: {
                      id: record.id || record.facility_id || `PS${Math.random().toString(36).substr(2, 6)}`,
                      name: record.name || record.facility_name || "抽水站",
                      type: "抽水站",
                      address: record.address || "",
                      district: record.district || "",
                      maintenance_status: record.maintenance_status || record.status || record.運轉狀態 || "正常",
                      water_level: record.water_level || record.current_level || record.水位 || "待測",
                      construction_year: record.construction_year || record.build_year || record.建造年份 || "未知",
                      source: api.name
                    }
                  };
                }
                return null;
              }).filter(Boolean);
          } 
          else if (api.type === "general" && data.result && data.result.records) {
            // 一般政府開放資料格式 - 篩選大漢溪流域抽水站
            features = data.result.records
              .filter(record => {
                const name = record.station_name || record.name || record.名稱 || "";
                const type = record.type || record.類型 || "";
                return name.includes("抽水") || type.includes("抽水") || isDahanRiverRelated(name);
              })
              .map(record => {
                const lat = parseFloat(record.latitude || record.lat || record.緯度);
                const lng = parseFloat(record.longitude || record.lng || record.lon || record.經度);
                
                if (lat && lng && !isNaN(lat) && !isNaN(lng) && isInDahanRiverArea(lat, lng)) {
                  return {
                    type: "Feature",
                    geometry: {
                      type: "Point",
                      coordinates: [lng, lat]
                    },
                    properties: {
                      id: record.station_id || record.id || record.編號 || `PS${Math.random().toString(36).substr(2, 6)}`,
                      name: record.station_name || record.name || record.名稱 || "抽水站",
                      type: "抽水站",
                      address: record.address || record.地址 || "",
                      maintenance_status: record.maintenance_status || record.status || record.運轉狀態 || "正常",
                      water_level: record.water_level || record.current_level || record.水位 || "待測",
                      construction_year: record.construction_year || record.build_year || record.建造年份 || "未知",
                      source: api.name
                    }
                  };
                }
                return null;
              }).filter(Boolean);
          }
          else if (api.type === "ntpc" && Array.isArray(data)) {
            // 新北市政府資料格式
            features = data
              .filter(record => {
                const name = record.name || record.facility_name || "";
                const type = record.type || "";
                return name.includes("抽水") || type.includes("抽水");
              })
              .map(record => {
                const lat = parseFloat(record.latitude || record.lat);
                const lng = parseFloat(record.longitude || record.lng);
                
                if (lat && lng && isInDahanRiverArea(lat, lng)) {
                  return {
                    type: "Feature",
                    geometry: {
                      type: "Point",
                      coordinates: [lng, lat]
                    },
                    properties: {
                      id: record.id || record.facility_id || `PS${Math.random().toString(36).substr(2, 6)}`,
                      name: record.name || "抽水站",
                      type: "抽水站",
                      address: record.address || "",
                      district: record.district || "",
                      maintenance_status: record.maintenance_status || record.status || "正常",
                      water_level: record.water_level || record.current_level || "待測",
                      construction_year: record.construction_year || record.build_year || "未知",
                      source: api.name
                    }
                  };
                }
                return null;
              }).filter(Boolean);
          }
          else if (api.type === "taipei" && data.result && data.result.records) {
            // 台北市政府資料格式
            features = data.result.records
              .filter(record => {
                const name = record.name || record.facility_name || "";
                const type = record.type || record.類型 || "";
                return name.includes("抽水") || type.includes("抽水") || name.includes("水門");
              })
              .map(record => {
                const lat = parseFloat(record.latitude || record.lat || record.緯度);
                const lng = parseFloat(record.longitude || record.lng || record.經度);
                
                if (lat && lng && isInDahanRiverArea(lat, lng)) {
                  return {
                    type: "Feature",
                    geometry: {
                      type: "Point",
                      coordinates: [lng, lat]
                    },
                    properties: {
                      id: record.id || `TP${Math.random().toString(36).substr(2, 6)}`,
                      name: record.name || "台北抽水站",
                      type: "抽水站",
                      address: record.address || record.地址 || "",
                      district: "台北市",
                      maintenance_status: record.status || "正常",
                      water_level: record.water_level || "待測",
                      construction_year: record.build_year || "未知",
                      source: api.name
                    }
                  };
                }
                return null;
              }).filter(Boolean);
          }
          else if (api.type === "iot" && data.value) {
            // IoT 感測器資料格式
            features = data.value.map(item => {
              if (item.Thing && item.Thing.location && item.Thing.location.coordinates) {
                const coords = item.Thing.location.coordinates;
                return {
                  type: "Feature",
                  geometry: {
                    type: "Point",
                    coordinates: coords
                  },
                  properties: {
                    name: item.Thing.name || "水利感測站",
                    type: item.Thing.properties?.type || "感測站",
                    description: item.Thing.description || "",
                    source: api.name
                  }
                };
              }
              return null;
            }).filter(Boolean);
          }

          if (features.length > 0) {
            console.log(`${api.name} 成功載入 ${features.length} 筆資料`);
            
            // 建立圖層
            const layer = L.geoJSON({
              type: "FeatureCollection",
              features: features
            }, {
              pointToLayer: (_, latlng) => L.marker(latlng, { icon }),
              onEachFeature: (feature, layer) => {
                const p = feature.properties;
                layer.bindPopup(`
                  <div style="min-width: 250px;">
                    <h3 style="margin: 0 0 8px 0; color: #1a5276; font-size: 1.1rem;">${p.name}</h3>
                    
                    <div style="margin-bottom: 6px;">
                      <strong>抽水站 ID:</strong> <code style="background: #f0f0f0; padding: 2px 4px; border-radius: 3px;">${p.id}</code>
                    </div>
                    
                    <div style="margin-bottom: 6px;">

    // 計算兩點間距離 (公尺)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // 地球半徑 (公尺)
      const φ1 = lat1 * Math.PI/180;
      const φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180;
      const Δλ = (lon2-lon1) * Math.PI/180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    // 生成抽水站名稱
    function generateStationName(props, index) {
      const district = props.district || "";
      const village = props.village || "";
      
      // 根據行政區和村里生成名稱
      if (village && village !== district.replace("新北市", "").replace("桃園市", "").replace("臺北市", "")) {
        return `${village}抽水站`;
      } else if (district.includes("新莊區")) {
        return `新莊第${index}抽水站`;
      } else if (district.includes("板橋區")) {
        return `板橋第${index}抽水站`;
      } else if (district.includes("三重區")) {
        return `三重第${index}抽水站`;
      } else if (district.includes("土城區")) {
        return `土城第${index}抽水站`;
      } else if (district.includes("樹林區")) {
        return `樹林第${index}抽水站`;
      } else if (district.includes("三峽區")) {
        return `三峽第${index}抽水站`;
      } else {
        return `大漢溪第${index}抽水站`;
      }
    }

    // 處理本地 GeoJSON 資料
    function processLocalGeoJSON(geojson) {
      updateStatus("正在處理本地資料...", false, false);
      
      // 先檢查所有資料的分布
      console.log(`原始資料總數: ${geojson.features.length}`);
      
      // 檢查哪些資料在範圍內
      geojson.features.forEach((feature, index) => {
        const coords = feature.geometry.coordinates;
        const lat = coords[1];
        const lng = coords[0];
        const inRange = isInDahanRiverArea(lat, lng);
        console.log(`抽水站 ${index + 1}: (${lat.toFixed(4)}, ${lng.toFixed(4)}) ${feature.properties.district} ${feature.properties.village} - 在範圍內: ${inRange}`);
      });
      
      // 過濾和清理資料 - 放寬條件
      const filteredFeatures = geojson.features
        .filter(feature => {
          const coords = feature.geometry.coordinates;
          const lat = coords[1];
          const lng = coords[0];
          
          // 雙北大漢溪流域範圍
          const expandedBounds = {
            north: 25.12,  // 五股、蘆洲北邊
            south: 24.95,  // 土城、樹林南邊
            east: 121.55,  // 台北市邊界
            west: 121.35   // 新莊、樹林西邊
          };
          
          const inExpandedRange = lat >= expandedBounds.south && 
                                  lat <= expandedBounds.north && 
                                  lng >= expandedBounds.west && 
                                  lng <= expandedBounds.east;
          
          if (!inExpandedRange) {
            console.log(`過濾掉範圍外的: ${feature.properties.name} (${lat}, ${lng}) - ${feature.properties.district}`);
            return false;
          }
          
          // 只過濾掉明顯不相關的地區 (減少過濾條件)
          const district = feature.properties.district || "";
          const village = feature.properties.village || "";
          
          if (district.includes("桃園") || 
              district.includes("汐止區") || 
              district.includes("文山區") || 
              district.includes("內湖區") ||
              district.includes("南港區") ||
              village.includes("公車站") ||
              village.includes("捷運站")) {
            console.log(`過濾掉不相關的: ${feature.properties.name} - ${district} ${village}`);
            return false;
          }
          
          return true;
        })
        // 移除重複位置 - 放寬距離條件
        .filter((feature, index, array) => {
          const coords1 = feature.geometry.coordinates;
          
          for (let i = 0; i < index; i++) {
            const coords2 = array[i].geometry.coordinates;
            const distance = calculateDistance(coords1[1], coords1[0], coords2[1], coords2[0]);
            
            if (distance < 20) { // 改為 20 公尺內視為重複 (原本 50 公尺)

    // 載入內嵌資料
    function loadLocalData() {
      updateStatus("載入內嵌資料...", false, false);
      
      try {
        console.log("使用內嵌 GeoJSON 資料");
        processLocalGeoJSON(EMBEDDED_GEOJSON);
      } catch (err) {
        console.error("處理內嵌資料失敗:", err);
        updateStatus("內嵌資料處理失敗，嘗試政府 API...", true, false);
        loadGovernmentData();
      }
    }

    // 用戶登入驗證和權限管理
    let currentUser = null;

    function checkAuth() {
      const userData = localStorage.getItem('currentUser');
      if (!userData) {
        // 未登入，跳轉到登入頁面
        window.location.href = 'login.html';
        return false;
      }
      
      try {
        currentUser = JSON.parse(userData);
        updateUserInterface();
        return true;
      } catch (error) {
        console.error('用戶資料解析失敗:', error);
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
        return false;
      }
    }

    function updateUserInterface() {
      if (!currentUser) return;
      
      // 更新用戶資訊顯示
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = getRoleText(currentUser.role);
      
      // 根據權限顯示功能
      if (currentUser.permissions.includes('manage')) {
        document.getElementById('adminControls').style.display = 'block';
      }
      
      console.log(`歡迎，${currentUser.name} (${getRoleText(currentUser.role)})`);
    }

    function getRoleText(role) {
      const roleMap = {
        'administrator': '系統管理員',
        'operator': '系統操作員',
        'viewer': '資料查看員',
        'citizen': '註冊民眾'
      };
      return roleMap[role] || '一般用戶';
    }

    function logout() {
      if (confirm('確定要登出系統嗎？')) {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
      }
    }

    function exportData() {
      if (!currentUser || !currentUser.permissions.includes('export')) {
        alert('您沒有資料匯出權限');
        return;
      }
      
      // 實作抽水站資料匯出功能
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-');
      const filename = `pumping_stations_${timestamp}.json`;
      
      const dataToExport = {
        exportTime: new Date().toISOString(),
        exportUser: currentUser.name,
        totalStations: document.getElementById('count').textContent,
        data: EMBEDDED_GEOJSON
      };
      
      const blob = new Blob([JSON.stringify(dataToExport, null, 2)], {
        type: 'application/json'
      });
      
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      
      alert('抽水站資料匯出完成！');
    }

    async function exportUsers() {
      if (!currentUser || !currentUser.permissions.includes('export')) {
        alert('您沒有用戶資料匯出權限');
        return;
      }

      try {
        await window.userManager.loadUsers();
        const userData = window.userManager.exportRegisteredUsers();
        
        if (!userData) {
          alert('沒有可匯出的用戶資料');
          return;
        }

        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-');
        const filename = `registered_users_${timestamp}.json`;
        
        const blob = new Blob([userData], {
          type: 'application/json'
        });
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        
        alert('用戶資料匯出完成！');
      } catch (error) {
        alert('匯出用戶資料時發生錯誤：' + error.message);
      }
    }

    async function showUserStats() {
      if (!currentUser || !currentUser.permissions.includes('manage')) {
        alert('您沒有查看用戶統計的權限');
        return;
      }

      try {
        await window.userManager.loadUsers();
        const stats = window.userManager.getUserStats();
        
        if (!stats) {
          alert('無法取得用戶統計資料');
          return;
        }

        const message = `
📊 用戶統計資料

👥 總用戶數: ${stats.totalUsers}
🔧 系統用戶: ${stats.totalSystemUsers}
📝 註冊用戶: ${stats.totalRegisteredUsers}
✅ 活躍用戶: ${stats.activeUsers}

📅 最後更新: ${new Date(stats.lastUpdated).toLocaleString('zh-TW')}
        `;
        
        alert(message);
      } catch (error) {
        alert('取得用戶統計時發生錯誤：' + error.message);
      }
    }

    function openAdminPanel() {
      if (!currentUser || !currentUser.permissions.includes('manage')) {
        alert('您沒有管理面板存取權限');
        return;
      }

      // 在新分頁開啟管理面板
      window.open('admin-panel.html', '_blank');
    }

    // 頁面載入時啟動
    document.addEventListener('DOMContentLoaded', async function() {
      // 先檢查登入狀態
      if (!checkAuth()) {
        return; // 未登入會自動跳轉
      }

      // 初始化用戶管理器
      try {
        await window.userManager.loadUsers();
        console.log('用戶管理器初始化完成');
      } catch (error) {
        console.warn('用戶管理器初始化失敗，使用備援方案:', error);
      }
      
      // 優先載入本地 GeoJSON 資料
      loadLocalData();
      
      // 啟動自動更新 (但會以本地資料為主)
      startAutoUpdate();
      
      // 模擬載入時間，然後隱藏載入畫面
      setTimeout(() => {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const mapElement = document.getElementById('map');
        
        loadingOverlay.style.opacity = '0';
        mapElement.classList.add('loaded');
        
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 500);
      }, 3000); // 3秒載入動畫

      console.log('🌊 大漢溪抽水站智慧管理系統已載入');
    });

    // 頁面卸載時清理
    window.addEventListener('beforeunload', function() {
      stopAutoUpdate();
    });
  </script>
