<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡化測試 - Google Maps</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    #map { width: 100%; height: 500px; background: #f0f0f0; border: 2px solid #007bff; }
    .status { 
      padding: 15px; 
      margin: 10px 0; 
      border-radius: 8px; 
      font-weight: bold;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    button { 
      padding: 12px 24px; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      margin: 5px;
    }
    button:hover { background: #0056b3; }
    pre { background: #f8f9fa; padding: 15px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🗺️ Google Maps 簡化測試</h1>
  
  <div id="status" class="info status">
    準備測試...
  </div>
  
  <button onclick="startTest()">開始測試 Google Maps</button>
  <button onclick="clearLog()">清除日誌</button>
  
  <div id="map"></div>
  
  <h3>測試日誌：</h3>
  <pre id="log">等待測試開始...\n</pre>

  <script>
    let logContent = '';
    
    function addLog(message) {
      const timestamp = new Date().toLocaleTimeString();
      logContent += `[${timestamp}] ${message}\n`;
      document.getElementById('log').textContent = logContent;
      console.log(message);
    }
    
    function clearLog() {
      logContent = '';
      document.getElementById('log').textContent = '日誌已清除...\n';
    }
    
    function updateStatus(message, type = 'info') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `${type} status`;
    }
    
    function startTest() {
      addLog('🚀 開始 Google Maps 測試');
      addLog('當前網域: ' + window.location.hostname);
      addLog('完整 URL: ' + window.location.href);
      
      updateStatus('正在測試 Google Maps API...', 'info');
      
      // 使用你的 API Key
      const apiKey = 'AIzaSyAWvgoKH9b7sfI_6yMG4U1teg-Dq4wQ9Fk';
      addLog('API Key 前綴: ' + apiKey.substring(0, 20) + '...');
      
      // 設定載入超時
      let timeoutId = setTimeout(() => {
        addLog('❌ 載入超時（15秒）');
        updateStatus('載入超時 - 可能是網域限制或網路問題', 'error');
      }, 15000);
      
      // 設定鑑權失敗處理
      window.gm_authFailure = function() {
        clearTimeout(timeoutId);
        addLog('❌ Google Maps 鑑權失敗');
        addLog('可能原因：');
        addLog('1. API Key 有網域限制（當前網域: ' + window.location.hostname + ')');
        addLog('2. 計費帳戶未設定');
        addLog('3. Maps JavaScript API 未啟用');
        updateStatus('鑑權失敗 - 請檢查 API Key 設定', 'error');
      };
      
      // 載入 Google Maps
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=initMap&v=weekly`;
      script.async = true;
      
      script.onload = () => {
        addLog('✅ Google Maps 腳本載入成功');
      };
      
      script.onerror = () => {
        clearTimeout(timeoutId);
        addLog('❌ Google Maps 腳本載入失敗');
        updateStatus('腳本載入失敗 - 網路問題或 API 限制', 'error');
      };
      
      // 地圖初始化回調
      window.initMap = function() {
        clearTimeout(timeoutId);
        addLog('✅ initMap 回調被觸發');
        
        try {
          if (typeof google === 'undefined' || !google.maps) {
            throw new Error('Google Maps API 物件未找到');
          }
          
          addLog('✅ Google Maps API 物件可用');
          addLog('google.maps.version: ' + (google.maps.version || '未知'));
          
          // 建立地圖
          const map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: 25.0330, lng: 121.5654 }, // 台北市
            zoom: 10,
            mapTypeId: 'roadmap'
          });
          
          addLog('✅ 地圖建立成功！');
          updateStatus('✅ Google Maps 測試成功！', 'success');
          
          // 添加一個標記來確認地圖正常工作
          new google.maps.Marker({
            position: { lat: 25.0330, lng: 121.5654 },
            map: map,
            title: '測試標記 - 台北市'
          });
          
          addLog('✅ 測試標記已添加');
          
        } catch (error) {
          addLog('❌ 地圖初始化失敗: ' + error.message);
          updateStatus('地圖初始化失敗', 'error');
        }
      };
      
      document.head.appendChild(script);
      addLog('📡 Google Maps 腳本已開始載入...');
    }
    
    // 頁面載入完成後的初始檢查
    document.addEventListener('DOMContentLoaded', function() {
      addLog('📄 頁面載入完成');
      addLog('User Agent: ' + navigator.userAgent);
      addLog('準備好進行測試');
    });
  </script>
</body>
</html>
