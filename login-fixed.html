<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>雙北大漢溪抽水站管理系統 - 登入</title>
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 背景動畫元素 */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .water-drop {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .water-drop:nth-child(1) { width: 40px; height: 40px; top: 10%; left: 10%; animation-delay: 0s; }
        .water-drop:nth-child(2) { width: 60px; height: 60px; top: 20%; left: 80%; animation-delay: 1s; }
        .water-drop:nth-child(3) { width: 30px; height: 30px; top: 60%; left: 15%; animation-delay: 2s; }
        .water-drop:nth-child(4) { width: 50px; height: 50px; top: 80%; left: 70%; animation-delay: 3s; }
        .water-drop:nth-child(5) { width: 35px; height: 35px; top: 40%; left: 90%; animation-delay: 4s; }

        /* 主容器 */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Logo 和標題 */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .system-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .system-subtitle {
            font-size: 16px;
            color: #7f8c8d;
            font-weight: 300;
        }

        /* 表單樣式 */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 500;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(248, 250, 252, 0.8);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #3498db;
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.15);
        }

        /* 登入按鈕 */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* 水波紋效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 錯誤/成功訊息 */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* 註冊連結 */
        .register-link {
            text-align: center;
            margin-top: 25px;
            padding: 15px 0;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* 載入狀態 */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading .login-btn {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        /* 版本資訊 */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            z-index: 5;
        }

        /* 響應式設計 */
        @media screen and (max-width: 767px) {
            body {
                align-items: stretch;
                justify-content: flex-start;
                min-height: 100vh;
                overflow-y: auto;
            }

            .login-container {
                width: 90%;
                max-width: none;
                margin: 20px auto;
                padding: 30px 20px;
                border-radius: 15px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
                margin-bottom: 60px !important;
                max-height: none;
                min-height: auto;
            }

            .logo-icon { font-size: 36px; }
            .system-title { font-size: 20px; }
            .system-subtitle { font-size: 14px; }
            .form-input { padding: 12px 16px; font-size: 16px; }
            .login-btn { padding: 14px; font-size: 16px; }

            .water-drop { display: none; }

            .footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 背景動畫 -->
    <div class="bg-animation">
        <div class="water-drop"></div>
        <div class="water-drop"></div>
        <div class="water-drop"></div>
        <div class="water-drop"></div>
        <div class="water-drop"></div>
    </div>

    <!-- 主登入容器 -->
    <div class="login-container">
        <!-- Logo 區域 -->
        <div class="logo">
            <span class="logo-icon">🏭</span>
            <h1 class="system-title">抽水站管理系統</h1>
            <p class="system-subtitle">雙北大漢溪流域</p>
        </div>

        <!-- 訊息顯示區域 -->
        <div id="errorMessage" class="message"></div>

        <!-- 登入表單 -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">使用者名稱或信箱</label>
                <input 
                    type="text" 
                    id="username" 
                    class="form-input" 
                    placeholder="請輸入使用者名稱或信箱"
                    autocomplete="username"
                    inputmode="text"
                    required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">密碼</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="請輸入密碼"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" id="loginButton" class="login-btn">
                登入系統
            </button>
        </form>

        <!-- 註冊連結 -->
        <div class="register-link">
            還沒有帳號？<a href="register.html">立即註冊</a>
        </div>
    </div>

    <!-- 版本資訊 -->
    <div class="footer">
        © 2026 雙北大漢溪抽水站 Web GIS 管理平台
    </div>

    <script>
        console.log('🚀 簡化版登入頁面載入');

        // 預設使用者資料（簡化版本，不依賴後端）
        const defaultUsers = {
            'admin': {
                username: 'admin',
                password: 'admin123',
                email: 'admin@example.com',
                role: 'admin',
                displayName: '系統管理員'
            },
            'manager': {
                username: 'manager',
                password: 'manager123',
                email: 'manager@example.com',
                role: 'manager',
                displayName: '管理員'
            },
            'operator': {
                username: 'operator',
                password: 'operator123',
                email: 'operator@example.com',
                role: 'operator',
                displayName: '操作員'
            }
        };

        // 登入表單處理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loginInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const form = document.getElementById('loginForm');
            
            // 清除之前的錯誤訊息
            errorDiv.style.display = 'none';
            
            if (!loginInput || !password) {
                showError('請填寫完整的登入資訊');
                return;
            }

            // 設定載入狀態
            form.classList.add('loading');
            
            try {
                console.log('🔑 嘗試登入:', loginInput);
                
                // 模擬網路延遲
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // 檢查使用者認證（簡化版本）
                let user = null;
                
                // 檢查是否為預設使用者
                for (const [key, userData] of Object.entries(defaultUsers)) {
                    if ((userData.username === loginInput || userData.email === loginInput) && 
                        userData.password === password) {
                        user = userData;
                        break;
                    }
                }
                
                // 檢查 localStorage 中的註冊使用者
                if (!user) {
                    const storedUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
                    for (const [key, userData] of Object.entries(storedUsers)) {
                        if ((userData.username === loginInput || userData.email === loginInput) && 
                            userData.password === password) {
                            user = userData;
                            break;
                        }
                    }
                }
                
                if (user) {
                    // 登入成功
                    console.log('✅ 登入成功:', user.displayName || user.username);
                    
                    // 儲存登入狀態
                    localStorage.setItem('currentUser', JSON.stringify({
                        username: user.username,
                        email: user.email,
                        role: user.role,
                        displayName: user.displayName || user.username,
                        loginTime: new Date().toISOString()
                    }));
                    
                    showSuccess(`歡迎回來，${user.displayName || user.username}！`);
                    
                    // 延遲跳轉以顯示成功訊息
                    setTimeout(() => {
                        console.log('🔄 跳轉到主頁面');
                        window.location.href = 'index.html';
                    }, 1000);
                    
                } else {
                    // 登入失敗
                    console.log('❌ 登入失敗：使用者名稱或密碼錯誤');
                    showError('使用者名稱或密碼錯誤，請重新輸入');
                }
                
            } catch (error) {
                console.error('❌ 登入錯誤:', error);
                showError('登入時發生錯誤，請稍後再試');
            } finally {
                // 移除載入狀態
                form.classList.remove('loading');
            }
        });

        // 顯示錯誤訊息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.className = 'message error';
            errorDiv.style.display = 'block';
        }

        // 顯示成功訊息
        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.className = 'message success';
            errorDiv.style.display = 'block';
        }

        // 檢查是否已經登入
        window.addEventListener('load', function() {
            console.log('📄 頁面載入完成');
            
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                const user = JSON.parse(currentUser);
                console.log('👤 已登入使用者:', user.username);
                showSuccess(`您已登入為 ${user.displayName || user.username}`);
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                return;
            }
            
            // 檢查 URL 參數中是否有登出訊息
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logout') === 'success') {
                showSuccess('您已成功登出');
                
                // 清除 URL 參數
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            
            console.log('ℹ️ 可用的測試帳號:');
            console.log('管理員: admin / admin123');
            console.log('操作員: operator / operator123');
        });

        // Enter 鍵快速登入
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // 按鈕水波紋效果
        document.getElementById('loginButton').addEventListener('click', function(e) {
            let ripple = document.createElement('span');
            ripple.classList.add('ripple');
            this.appendChild(ripple);

            let rect = this.getBoundingClientRect();
            let size = Math.max(rect.width, rect.height);
            let x = e.clientX - rect.left - size / 2;
            let y = e.clientY - rect.top - size / 2;

            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';

            setTimeout(() => ripple.remove(), 600);
        });

        // 輸入框聚焦動畫
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.transform = 'scale(1.02)';
                this.style.transition = 'all 0.3s ease';
            });
            
            input.addEventListener('blur', function() {
                this.style.transform = 'scale(1)';
            });
        });

        // 載入動畫
        window.addEventListener('load', function() {
            const container = document.querySelector('.login-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';

            requestAnimationFrame(() => {
                container.style.transition = 'all 0.5s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
