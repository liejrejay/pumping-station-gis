<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>雙北大漢溪抽水站 - 民眾註冊</title>
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #16a085 0%, #2980b9 50%, #8e44ad 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 背景動畫元素 */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .water-wave {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: wave 8s infinite ease-in-out;
        }

        @keyframes wave {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 0.1; }
        }

        .water-wave:nth-child(1) { width: 60px; height: 60px; top: 15%; left: 15%; animation-delay: 0s; }
        .water-wave:nth-child(2) { width: 40px; height: 40px; top: 25%; left: 75%; animation-delay: 2s; }
        .water-wave:nth-child(3) { width: 80px; height: 80px; top: 60%; left: 10%; animation-delay: 4s; }
        .water-wave:nth-child(4) { width: 30px; height: 30px; top: 75%; left: 80%; animation-delay: 6s; }

        .register-container {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            padding: 45px 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* 手機版修復 */
        @media screen and (max-width: 767px) {
            body {
                padding: 0;
                align-items: flex-start;
                padding-top: 15px;
            }
            
            .register-container {
                width: calc(100vw - 25px);
                max-width: none;
                padding: 25px 20px;
                margin: 10px 12px;
                border-radius: 20px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            }

            .logo {
                width: 80px !important;
                height: 80px !important;
                margin-bottom: 15px !important;
            }

            .logo-icon {
                font-size: 1.8rem !important;
            }

            .system-title {
                font-size: 1.3rem !important;
                margin-bottom: 6px !important;
                line-height: 1.3;
            }

            .system-subtitle {
                font-size: 0.85rem !important;
                margin-bottom: 20px !important;
            }

            .form-group {
                margin-bottom: 15px !important;
                text-align: left;
            }

            .form-label {
                font-size: 0.85rem !important;
                margin-bottom: 6px !important;
            }

            .form-input {
                padding: 14px 16px !important;
                font-size: 16px !important;
                border-radius: 10px !important;
            }

            .password-strength {
                font-size: 0.7rem !important;
                margin-top: 5px !important;
            }

            .register-btn {
                padding: 16px 18px !important;
                font-size: 1rem !important;
                margin-top: 15px !important;
                border-radius: 10px !important;
            }

            .info-box {
                padding: 12px !important;
                font-size: 0.75rem !important;
                margin-top: 15px !important;
                border-radius: 10px !important;
            }

            .footer {
                position: relative !important;
                bottom: auto !important;
                left: auto !important;
                transform: none !important;
                margin-top: 20px;
                font-size: 0.7rem !important;
                text-align: center;
                padding: 0 10px;
            }

            /* 隱藏背景動畫 */
            .water-wave {
                display: none;
            }
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #16a085 0%, #2980b9 50%, #8e44ad 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: registerPulse 4s infinite;
        }

        @keyframes registerPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05) rotate(90deg); }
            50% { transform: scale(1.1) rotate(180deg); }
            75% { transform: scale(1.05) rotate(270deg); }
        }

        .logo-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-align: center;
        }

        .logo-icon {
            font-size: 2.2rem;
            margin-bottom: 2px;
        }

        .logo-text {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .system-title {
            color: #333;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .system-subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            color: #555;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-input:focus {
            outline: none;
            border-color: #28a745;
            background: white;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
        }

        .password-strength {
            margin-top: 5px;
            font-size: 0.8rem;
            height: 20px;
        }

        .strength-weak { color: #dc3545; }
        .strength-medium { color: #ffc107; }
        .strength-strong { color: #28a745; }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #16a085 0%, #2980b9 50%, #8e44ad 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s;
        }

        .register-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(22, 160, 133, 0.4);
        }

        .register-btn:hover::before {
            left: 100%;
        }

        .register-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            font-size: 0.85rem;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .error-message {
            color: #721c24;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .login-link {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
        }

        .login-link a {
            color: #28a745;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .info-box {
            margin-top: 25px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #856404;
            text-align: left;
        }

        .info-box h4 {
            margin-bottom: 8px;
            color: #533f03;
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <!-- 背景動畫 -->
    <div class="bg-animation">
        <div class="water-wave"></div>
        <div class="water-wave"></div>
        <div class="water-wave"></div>
        <div class="water-wave"></div>
    </div>

    <div class="register-container">
        <div class="logo">
            <div class="logo-content">
                <div class="logo-icon">🏗️</div>
                <div class="logo-text">JOIN</div>
            </div>
        </div>
        
        <h1 class="system-title">民眾註冊</h1>
        <p class="system-subtitle">加入雙北大漢溪抽水站監控平台</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username" class="form-label">使用者帳號</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="請輸入帳號 (3-20個字元)" 
                    required
                    minlength="3"
                    maxlength="20"
                >
            </div>

            <div class="form-group">
                <label for="nickname" class="form-label">顯示暱稱</label>
                <input 
                    type="text" 
                    id="nickname" 
                    name="nickname" 
                    class="form-input" 
                    placeholder="請輸入顯示暱稱" 
                    required
                    autocomplete="nickname"
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">電子郵件</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="請輸入電子郵件地址" 
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="phone" class="form-label">聯絡電話</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    class="form-input" 
                    placeholder="請輸入聯絡電話" 
                    required
                    autocomplete="tel"
                    inputmode="tel"
                >
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">設定密碼</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="請設定密碼 (至少6個字元)" 
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
                <div id="passwordStrength" class="password-strength"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">確認密碼</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    class="form-input" 
                    placeholder="請再次輸入密碼" 
                    required
                    autocomplete="new-password"
                >
            </div>
            
            <button type="submit" class="register-btn" id="submitBtn">
                🌊 建立帳號 🏢
            </button>
            
            <div id="message" class="message"></div>
        </form>

        <div class="info-box">
            <h4>📋 註冊說明</h4>
            <ul style="margin: 0; padding-left: 18px;">
                <li>註冊帳號可查看抽水站即時資訊</li>
                <li>可使用帳號或電子郵件登入</li>
                <li>暱稱將作為系統顯示名稱</li>
                <li>請妥善保管帳號密碼</li>
                <li>如有問題請聯絡管理單位</li>
            </ul>
        </div>

        <div class="login-link">
            <p>已有帳號？ <a href="login.html">立即登入</a></p>
        </div>
    </div>
    
    <div class="footer">
        <div>🏗️ © 2026 雙北大漢溪抽水站管理系統 🏗️</div>
        <div style="margin-top: 5px; font-size: 0.75rem; opacity: 0.9;">
            民眾服務平台 | 安全 • 智慧 • 便民
        </div>
    </div>

    <!-- 載入 API 客戶端 -->
    <script src="js/apiClient.js"></script>
    <script>
        // 密碼強度檢測
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                return;
            }

            let strength = 0;
            let feedback = [];

            // 長度檢查
            if (password.length >= 6) strength += 1;
            else feedback.push('至少6個字元');

            // 包含數字
            if (/\d/.test(password)) strength += 1;
            else feedback.push('包含數字');

            // 包含字母
            if (/[a-zA-Z]/.test(password)) strength += 1;
            else feedback.push('包含字母');

            // 包含特殊字元
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength += 1;

            let strengthText = '';
            let className = '';

            if (strength < 2) {
                strengthText = '密碼強度：弱';
                className = 'strength-weak';
            } else if (strength < 3) {
                strengthText = '密碼強度：中';
                className = 'strength-medium';
            } else {
                strengthText = '密碼強度：強';
                className = 'strength-strong';
            }

            if (feedback.length > 0) {
                strengthText += ` (建議：${feedback.join('、')})`;
            }

            strengthDiv.textContent = strengthText;
            strengthDiv.className = `password-strength ${className}`;
        });

        // 確認密碼檢查
        document.getElementById('confirmPassword').addEventListener('input', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = e.target.value;
            const submitBtn = document.getElementById('submitBtn');

            if (confirmPassword && password !== confirmPassword) {
                e.target.style.borderColor = '#dc3545';
                submitBtn.disabled = true;
            } else {
                e.target.style.borderColor = '#e1e5e9';
                submitBtn.disabled = false;
            }
        });

        // 帳號格式檢查
        document.getElementById('username').addEventListener('input', function(e) {
            const username = e.target.value;
            const validPattern = /^[a-zA-Z0-9_-]+$/;
            
            if (username && !validPattern.test(username)) {
                e.target.style.borderColor = '#dc3545';
                showMessage('帳號只能包含英文、數字、底線和連字號', 'error');
            } else {
                e.target.style.borderColor = '#e1e5e9';
            }
        });

        // API 客戶端初始化
        let isInitialized = false;

        async function initializeApiClient() {
            if (isInitialized) return;
            
            try {
                await window.apiClient.checkServerAvailability();
                isInitialized = true;
                console.log('API 客戶端初始化完成:', window.apiClient.getStatusMessage());
            } catch (error) {
                console.error('API 客戶端初始化失敗:', error);
            }
        }

        // 註冊表單處理
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const userData = {
                username: formData.get('username').trim(),
                nickname: formData.get('nickname').trim(),
                email: formData.get('email').trim(),
                phone: formData.get('phone').trim(),
                password: formData.get('password'),
                confirmPassword: formData.get('confirmPassword')
            };

            // 基本驗證
            if (!validateForm(userData)) return;

            // 確保 API 客戶端已初始化
            await initializeApiClient();

            // 使用 API 客戶端註冊
            const registerResult = await window.apiClient.register(userData);

            if (registerResult.success) {
                showMessage('註冊成功！即將跳轉到登入頁面...', 'success');

                // 延遲跳轉
                setTimeout(() => {
                    window.location.href = 'login.html?username=' + encodeURIComponent(userData.username);
                }, 2000);

            } else {
                showMessage(registerResult.error || '註冊失敗，請重試', 'error');
            }
        });

        function validateForm(data) {
            // 檢查必填欄位
            for (let key in data) {
                if (key !== 'confirmPassword' && !data[key]) {
                    showMessage('請填寫所有必填欄位', 'error');
                    return false;
                }
            }

            // 檢查密碼一致性
            if (data.password !== data.confirmPassword) {
                showMessage('密碼與確認密碼不一致', 'error');
                return false;
            }

            // 檢查密碼強度
            if (data.password.length < 6) {
                showMessage('密碼至少需要6個字元', 'error');
                return false;
            }

            // 檢查帳號格式
            const validPattern = /^[a-zA-Z0-9_-]+$/;
            if (!validPattern.test(data.username)) {
                showMessage('帳號格式不正確', 'error');
                return false;
            }

            return true;
        }

        // 頁面載入時初始化
        window.addEventListener('load', async function() {
            await initializeApiClient();
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type === 'error' ? 'error-message' : 'success-message'}`;
            messageDiv.style.display = 'block';

            if (type !== 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
