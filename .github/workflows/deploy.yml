name: Deploy to GitHub Pages

# 推送到 main 時建置 dist，並部署到 gh-pages 分支（內含 runtime-config.js）
# Pages 設定請選：Deploy from a branch → gh-pages → / (root)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p dist/js

          cp *.html dist/ 2>/dev/null || true
          cp -r css dist/ 2>/dev/null || true
          cp -r js dist/ 2>/dev/null || true
          cp -r data dist/ 2>/dev/null || true

          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::未設定 GOOGLE_MAPS_API_KEY。請到 Settings → Secrets and variables → Actions 新增後再部署。"
            exit 1
          fi
          node -e "const k=process.env.GOOGLE_MAPS_API_KEY; require('fs').writeFileSync('dist/js/runtime-config.js', 'window.GOOGLE_MAPS_API_KEY = '+JSON.stringify(k)+';\\n');"
          echo "✅ runtime-config.js 已產生"

          echo "" > dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
