name: Deploy to GitHub Pages

# 推送到 main 時建置 dist，並部署到 gh-pages 分支（內含 runtime-config.js）
# Pages 設定請選：Deploy from a branch → gh-pages → / (root)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        run: |
          set -e
          mkdir -p dist/js

          # 先複製靜態檔（抽水站 geojson 等），避免氣象 API 失敗導致整次部署失敗
          cp *.html dist/ 2>/dev/null || true
          cp -r css dist/ 2>/dev/null || true
          cp -r js dist/ 2>/dev/null || true
          cp -r data dist/ 2>/dev/null || true

          if [ -n "$CWA_API_KEY" ]; then
            node scripts/fetch_cwa_snapshot.js || echo "::warning::CWA 快照失敗，沿用 repo 內 data/cwa-weather-latest.json"
          else
            echo "::warning::未設定 CWA_API_KEY Secret，公開站氣象可能無資料"
          fi

          node scripts/fetch_wra_water_snapshot.js || echo "::warning::WRA 快照失敗，沿用 repo 內 data/wra-water-latest.json"
          cp -r data dist/

          SHORT_SHA=$(git rev-parse --short HEAD)
          if grep -q 'PUMPING_STATIONS_DATA_VERSION' dist/index.html; then
            sed -i "s/PUMPING_STATIONS_DATA_VERSION = \"[^\"]*\"/PUMPING_STATIONS_DATA_VERSION = \"${SHORT_SHA}\"/" dist/index.html
            echo "✅ pumping-stations cache bust → ${SHORT_SHA}"
          fi
          echo "${SHORT_SHA}" > dist/data/pumping-data-version.txt

          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::未設定 GOOGLE_MAPS_API_KEY。請到 Settings → Secrets and variables → Actions 新增後再部署。"
            exit 1
          fi
          API_URL="$PUBLIC_API_BASE_URL"
          if [ -z "$API_URL" ] && [ -f config/public-api-base-url.txt ]; then
            API_URL=$(tr -d '\r' < config/public-api-base-url.txt | head -n 1 | xargs)
            echo "ℹ️  Secret 為空，改用 config/public-api-base-url.txt"
          fi
          export API_URL
          node -e "const fs=require('fs');const k=process.env.GOOGLE_MAPS_API_KEY;const api=process.env.API_URL||'';fs.writeFileSync('dist/js/runtime-config.js','window.GOOGLE_MAPS_API_KEY = '+JSON.stringify(k)+';\\nwindow.PUBLIC_API_BASE_URL = '+JSON.stringify(api)+';\\n');"
          echo "✅ runtime-config.js 已產生"
          if [ -z "$API_URL" ]; then
            echo "::warning::PUBLIC_API_BASE_URL 仍為空（Secret 與 config 皆無）"
          else
            echo "✅ PUBLIC_API_BASE_URL 長度: ${#API_URL}"
          fi
          cp js/apiBase.js dist/js/
          cp js/api-endpoint.js dist/js/ 2>/dev/null || true

          echo "" > dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
