name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm install
        fi
        
    - name: Create production build
      env:
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      run: |
        mkdir -p dist/js
        
        cp *.html dist/ 2>/dev/null || true
        cp -r css dist/ 2>/dev/null || true
        cp -r js dist/ 2>/dev/null || true
        cp -r data dist/ 2>/dev/null || true
        
        # 從 GitHub Secret 注入 runtime-config（不入 git）
        if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
          node -e "const k=process.env.GOOGLE_MAPS_API_KEY; require('fs').writeFileSync('dist/js/runtime-config.js', 'window.GOOGLE_MAPS_API_KEY = '+JSON.stringify(k)+';\\n');"
          echo "✅ runtime-config.js 已產生"
        else
          echo "⚠️ 未設定 GOOGLE_MAPS_API_KEY secret，地圖將無法載入"
        fi
        
        echo "" > dist/.nojekyll
        echo "/* /index.html 200" > dist/_redirects

    - name: Setup Pages
      uses: actions/configure-pages@v3
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2